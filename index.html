<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1633" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="A cozy fantasy tower defense game." />
    <title>Hearthwood Defense</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse at center, #3a2a63 0%, #1e1633 70%);
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      /* Phaser's Scale.FIT + autoCenter does the centering; the parent just fills the screen. */
      #game {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      canvas { display: block; touch-action: none; }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #2a2238;
        color: #fff4dc;
        font: 600 20px "Trebuchet MS", system-ui, sans-serif;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
      }
      #rotate .phone {
        width: 46px;
        height: 78px;
        border: 4px solid #f2c14e;
        border-radius: 10px;
        animation: turn 2s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 25% { transform: rotate(-90deg); }
        60%, 100% { transform: rotate(0deg); }
      }
      /* Phones held sideways: ask for portrait (the game is a vertical 9:16 layout). */
      @media (orientation: landscape) and (max-height: 600px) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div><div>Turn your phone upright<br />to defend the hollow</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
